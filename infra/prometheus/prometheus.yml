# Prometheus scrape /actuator/prometheus của mọi service trong mạng Docker (cổng nội bộ, không đi qua Gateway).
# Mỗi target có nhãn "service"; metric của Micrometer còn có nhãn "application" (= spring.application.name).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: shop-services
    metrics_path: /actuator/prometheus
    static_configs:
      # API Gateway: actuator ở cổng quản trị riêng 9080 (cổng 8080 công khai không lộ /actuator)
      - targets: ["api-gateway:9080"]
        labels: { service: api-gateway }
      - targets: ["auth-service:8081"]
        labels: { service: auth-service }
      - targets: ["user-service:8082"]
        labels: { service: user-service }
      - targets: ["product-service:8083"]
        labels: { service: product-service }
      - targets: ["cart-service:8084"]
        labels: { service: cart-service }
      - targets: ["order-service:8085"]
        labels: { service: order-service }
      - targets: ["inventory-service:8086"]
        labels: { service: inventory-service }
      - targets: ["payment-service:8087"]
        labels: { service: payment-service }
      - targets: ["notification-service:8088"]
        labels: { service: notification-service }
      - targets: ["analytics-service:8089"]
        labels: { service: analytics-service }
      - targets: ["simulator-service:8091"]
        labels: { service: simulator-service }
      - targets: ["fraud-service:8092"]
        labels: { service: fraud-service }
      - targets: ["loyalty-service:8093"]
        labels: { service: loyalty-service }
      - targets: ["shipping-service:8094"]
        labels: { service: shipping-service }
      - targets: ["review-service:8095"]
        labels: { service: review-service }
      - targets: ["promotion-service:8096"]
        labels: { service: promotion-service }
      - targets: ["audit-service:8097"]
        labels: { service: audit-service }
