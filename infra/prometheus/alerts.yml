# Luật cảnh báo – xem trạng thái tại http://localhost:9090/alerts (và trên dashboard Grafana).
# Ngưỡng là giá trị khởi đầu cho môi trường demo; chỉnh theo lưu lượng thực tế.
groups:
  - name: shop-availability
    rules:
      # for: 3m – khi docker compose up, 18 JVM cần 1–2,5 phút mới sẵn sàng; tránh báo động giả mỗi lần khởi động
      - alert: ServiceDown
        expr: up{job="shop-services"} == 0
        for: 3m
        labels: { severity: critical }
        annotations:
          summary: "Service {{ $labels.service }} không phản hồi"
          description: "Prometheus không scrape được {{ $labels.instance }} trong hơn 3 phút."

      - alert: HighErrorRate
        expr: |
          sum by (application) (rate(http_server_requests_seconds_count{status=~"5..", uri!~"/actuator.*"}[5m]))
            / sum by (application) (rate(http_server_requests_seconds_count{uri!~"/actuator.*"}[5m])) > 0.05
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.application }}: hơn 5% request lỗi 5xx"
          description: "Tỷ lệ lỗi 5 phút gần nhất: {{ $value | humanizePercentage }}."

      - alert: SlowResponses
        expr: |
          histogram_quantile(0.95, sum by (le, application) (rate(http_server_requests_seconds_bucket{uri!~"/actuator.*"}[5m]))) > 2
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.application }}: p95 thời gian phản hồi > 2 giây"

  - name: shop-messaging
    rules:
      - alert: OutboxBacklog
        expr: shop_outbox_pending > 100
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.application }}: {{ $value }} sự kiện outbox chưa gửi lên Kafka"
          description: "Outbox relay không theo kịp hoặc Kafka không nhận được message."

      - alert: MessagesInDeadLetterTopic
        expr: increase(shop_kafka_dlt_total[10m]) > 0
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.application }}: có message bị đưa vào {{ $labels.topic }}-dlt"
          description: "Message xử lý lỗi sau khi retry – kiểm tra log và topic DLT trên Kafka UI."

      - alert: KafkaConsumerLag
        expr: max by (application) (kafka_consumer_fetch_manager_records_lag_max) > 1000
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.application }}: consumer chậm hơn {{ $value }} message"

  - name: shop-resources
    rules:
      - alert: DatabasePoolExhausted
        expr: max by (application) (hikaricp_connections_pending) > 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.application }}: request đang phải chờ kết nối CSDL"
          description: "Pool kết nối đầy – kiểm tra DB_POOL_SIZE và max_connections của PostgreSQL."

      - alert: HighHeapUsage
        expr: |
          sum by (application) (jvm_memory_used_bytes{area="heap"}) / sum by (application) (jvm_memory_max_bytes{area="heap"}) > 0.9
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.application }}: heap JVM dùng trên 90%"

  - name: shop-security
    rules:
      - alert: LoginFailureSpike
        expr: sum(rate(shop_auth_logins_total{result!="success"}[5m])) * 60 > 30
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: "Hơn 30 lần đăng nhập thất bại mỗi phút"
          description: "Có thể đang bị dò mật khẩu – xem Nhật ký kiểm toán (/admin/audit)."

      - alert: AlertDeliveryFailing
        expr: sum by (channel) (increase(shop_alerting_deliveries_total{result="error"}[15m])) > 0
        labels: { severity: warning }
        annotations:
          summary: "Không gửi được cảnh báo qua kênh {{ $labels.channel }}"
          description: "Kiểm tra cấu hình ALERT_* / SMTP_* của notification-service (xem trang Lịch sử cảnh báo)."

      - alert: RateLimitTriggered
        expr: sum by (rule) (rate(shop_gateway_rate_limited_total[5m])) * 60 > 10
        for: 5m
        labels: { severity: info }
        annotations:
          summary: "Gateway chặn hơn 10 request/phút ở nhóm {{ $labels.rule }}"

  - name: shop-business
    rules:
      # Cảnh báo nghiệp vụ từ Kafka Streams (đơn tăng đột biến, thanh toán lỗi, tồn kho thấp, đơn nghi gian lận)
      - alert: BusinessAlert
        expr: sum by (type, severity) (increase(shop_analytics_alerts_total[5m])) > 0
        labels: { source: analytics }
        annotations:
          summary: "Cảnh báo nghiệp vụ {{ $labels.type }}"
          description: "{{ $value | printf \"%.0f\" }} cảnh báo {{ $labels.type }} trong 5 phút – xem chi tiết trên Dashboard (/admin)."

      - alert: SupportTicketsOverdue
        expr: max(shop_support_tickets_overdue) > 0
        for: 5m
        labels: { severity: warning, service: support-service }
        annotations:
          summary: "{{ $value }} yêu cầu hỗ trợ quá hạn phản hồi (SLA)"
          description: "Có yêu cầu của khách chưa được phản hồi lần đầu đúng hạn – xem /admin/support."

      - alert: SupportBacklogHigh
        expr: max(shop_support_tickets_unassigned) > 20
        for: 10m
        labels: { severity: warning, service: support-service }
        annotations:
          summary: "{{ $value }} yêu cầu hỗ trợ chưa có người nhận"
