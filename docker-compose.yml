name: shop-platform

# Cấu hình chung cho các microservice Spring Boot
x-service: &service
  build:
    context: .
    dockerfile: docker/service.Dockerfile
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    db-init:
      condition: service_completed_successfully
    kafka:
      condition: service_healthy

x-service-env: &service-env
  KAFKA_BOOTSTRAP: kafka:9092
  DB_USER: ${POSTGRES_USER:-shop}
  DB_PASSWORD: ${POSTGRES_PASSWORD:-shop}
  JWT_SECRET: ${JWT_SECRET:-change-me-please-this-is-a-dev-only-secret-0123456789}
  JAVA_OPTS: ${JAVA_OPTS:--Xms64m -Xmx320m -XX:+UseSerialGC}
  # 17 service dùng DB × pool mặc định 10 vượt max_connections của PostgreSQL → "too many clients already".
  # Mỗi service chỉ cần vài kết nối; tổng 17 × 5 = 85 (max_connections=200).
  SPRING_DATASOURCE_HIKARI_MAXIMUMPOOLSIZE: ${DB_POOL_SIZE:-5}
  SPRING_DATASOURCE_HIKARI_MINIMUMIDLE: 1

services:
  # ------------------------------------------------------------------ Hạ tầng
  postgres:
    image: postgres:16-alpine
    # Dư địa cho 17 service dùng DB + db-init + psql thủ công (mặc định chỉ 100)
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shop}
      POSTGRES_DB: shop
    ports:
      # Cổng phía host là 5433 để không đụng PostgreSQL cài sẵn trên máy (5432)
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shop}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Tạo database còn thiếu (an toàn khi chạy lại) – cần cho volume PostgreSQL tạo từ phiên bản trước
  db-init:
    image: postgres:16-alpine
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-shop}
    volumes:
      - ./infra/postgres/init.sql:/init.sql:ro
    command: ["psql", "-h", "postgres", "-U", "${POSTGRES_USER:-shop}", "-d", "shop", "-v", "ON_ERROR_STOP=1", "-f", "/init.sql"]

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.9.0
    hostname: kafka
    ports:
      - "9094:9094"
    environment:
      CLUSTER_ID: "q1Sh-9_ISia_zwGINzRvyQ"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 15s

  kafka-ui:
    image: kafbat/kafka-ui:v1.0.0
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: shop-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  # ------------------------------------------------------------------ Microservices
  api-gateway:
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        SERVICE: api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      JWT_SECRET: ${JWT_SECRET:-change-me-please-this-is-a-dev-only-secret-0123456789}
      JAVA_OPTS: ${JAVA_OPTS:--Xms64m -Xmx320m -XX:+UseSerialGC}
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
      AUTH_SERVICE_URL: http://auth-service:8081
      USER_SERVICE_URL: http://user-service:8082
      PRODUCT_SERVICE_URL: http://product-service:8083
      CART_SERVICE_URL: http://cart-service:8084
      ORDER_SERVICE_URL: http://order-service:8085
      INVENTORY_SERVICE_URL: http://inventory-service:8086
      PAYMENT_SERVICE_URL: http://payment-service:8087
      NOTIFICATION_SERVICE_URL: http://notification-service:8088
      ANALYTICS_SERVICE_URL: http://analytics-service:8089
      SIMULATOR_SERVICE_URL: http://simulator-service:8091
      FRAUD_SERVICE_URL: http://fraud-service:8092
      LOYALTY_SERVICE_URL: http://loyalty-service:8093
      SHIPPING_SERVICE_URL: http://shipping-service:8094
      REVIEW_SERVICE_URL: http://review-service:8095
      PROMOTION_SERVICE_URL: http://promotion-service:8096
      AUDIT_SERVICE_URL: http://audit-service:8097
      SUPPORT_SERVICE_URL: http://support-service:8098
      RECOMMENDATION_SERVICE_URL: http://recommendation-service:8099
      # Rate limit (đếm qua Redis). Khi chạy k6 tải nặng có thể đặt RATE_LIMIT_ENABLED=false
      REDIS_HOST: redis
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_LOGIN_PER_MINUTE: ${RATE_LIMIT_LOGIN_PER_MINUTE:-300}
      RATE_LIMIT_ORDERS_PER_MINUTE: ${RATE_LIMIT_ORDERS_PER_MINUTE:-20}
      RATE_LIMIT_DEFAULT_PER_MINUTE: ${RATE_LIMIT_DEFAULT_PER_MINUTE:-3000}
    depends_on:
      redis:
        condition: service_healthy

  auth-service:
    <<: *service
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        SERVICE: auth-service
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/auth_db
      AUTH_MAX_FAILED_LOGINS: ${AUTH_MAX_FAILED_LOGINS:-5}
      AUTH_LOCK_DURATION: ${AUTH_LOCK_DURATION:-PT5M}

  user-service:
    <<: *service
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        SERVICE: user-service
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/user_db

  product-service:
    <<: *service
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        SERVICE: product-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/product_db
      REDIS_HOST: redis

  cart-service:
    <<: *service
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        SERVICE: cart-service
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/cart_db

  order-service:
    <<: *service
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        SERVICE: order-service
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/order_db
      ORDER_TIMEOUT: ${ORDER_TIMEOUT:-PT2M}
      ORDER_REVIEW_TIMEOUT: ${ORDER_REVIEW_TIMEOUT:-PT30M}
      FRAUD_CHECK_ENABLED: ${FRAUD_CHECK_ENABLED:-true}
      PROMOTION_CHECK_ENABLED: ${PROMOTION_CHECK_ENABLED:-true}

  inventory-service:
    <<: *service
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        SERVICE: inventory-service
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/inventory_db

  payment-service:
    <<: *service
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        SERVICE: payment-service
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/payment_db
      PAYMENT_FAILURE_RATE: ${PAYMENT_FAILURE_RATE:-0.1}
      PAYMENT_DELAY_MS: ${PAYMENT_DELAY_MS:-50}

  notification-service:
    <<: *service
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        SERVICE: notification-service
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/notification_db
      # Chuyển tiếp cảnh báo của Alertmanager (token phải trùng infra/alertmanager/alertmanager.yml)
      ALERT_WEBHOOK_TOKEN: ${ALERT_WEBHOOK_TOKEN:-change-me-alert-webhook-token}
      ALERT_SLACK_WEBHOOK_URL: ${ALERT_SLACK_WEBHOOK_URL:-}
      ALERT_DISCORD_WEBHOOK_URL: ${ALERT_DISCORD_WEBHOOK_URL:-}
      ALERT_TELEGRAM_BOT_TOKEN: ${ALERT_TELEGRAM_BOT_TOKEN:-}
      ALERT_TELEGRAM_CHAT_ID: ${ALERT_TELEGRAM_CHAT_ID:-}
      # Email cảnh báo – mặc định gửi vào Mailpit (http://localhost:8025); đổi SMTP_* để gửi email thật
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-admin@shop.local}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-false}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}

  analytics-service:
    <<: *service
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        SERVICE: analytics-service
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/analytics_db
      ORDER_SPIKE_THRESHOLD: ${ORDER_SPIKE_THRESHOLD:-30}
      PAYMENT_FAILURE_THRESHOLD: ${PAYMENT_FAILURE_THRESHOLD:-5}
      # Khôi phục Dashboard từ snapshot trong CSDL thay vì đọc lại toàn bộ analytics-events khi khởi động
      DASHBOARD_SNAPSHOT_ENABLED: ${DASHBOARD_SNAPSHOT_ENABLED:-true}
    volumes:
      - streams-state:/tmp/kafka-streams

  # ------------------------------------------------------------------ Dịch vụ mở rộng (Ecommerce 2.0)
  fraud-service:
    <<: *service
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        SERVICE: fraud-service
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/fraud_db
      FRAUD_REVIEW_SCORE: ${FRAUD_REVIEW_SCORE:-70}

  loyalty-service:
    <<: *service
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        SERVICE: loyalty-service
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/loyalty_db

  shipping-service:
    <<: *service
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        SERVICE: shipping-service
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/shipping_db

  review-service:
    <<: *service
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        SERVICE: review-service
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/review_db

  # Flash sale, voucher, đổi điểm lấy voucher; định giá khuyến mãi cho mọi đơn trong Saga
  promotion-service:
    <<: *service
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        SERVICE: promotion-service
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/promotion_db
      PROMOTION_SEED: ${PROMOTION_SEED:-true}

  # Nhật ký kiểm toán (audit-events) + cảnh báo bảo mật
  audit-service:
    <<: *service
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        SERVICE: audit-service
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/audit_db

  # Hỗ trợ khách hàng: yêu cầu hỗ trợ + chat realtime (SSE) + SLA phản hồi
  support-service:
    <<: *service
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        SERVICE: support-service
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/support_db
      SUPPORT_SLA_NORMAL: ${SUPPORT_SLA_NORMAL:-PT2H}

  # Gợi ý sản phẩm (AI Recommendation): học trực tuyến từ product/order/user-activity/cart/review-events
  recommendation-service:
    <<: *service
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        SERVICE: recommendation-service
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/recommendation_db
      REC_ATTRIBUTION_WINDOW: ${REC_ATTRIBUTION_WINDOW:-24h}

  # Khách hàng ảo + nhân viên ảo: tạo lưu lượng mua sắm ngẫu nhiên liên tục qua API Gateway.
  # Điều khiển tại http://localhost:3000/admin/simulator (tài khoản ADMIN).
  simulator-service:
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        SERVICE: simulator-service
    restart: unless-stopped
    depends_on:
      - api-gateway
    environment:
      GATEWAY_URL: http://api-gateway:8080
      SIMULATOR_AUTOSTART: ${SIMULATOR_AUTOSTART:-true}
      SIMULATOR_SESSIONS_PER_MINUTE: ${SIMULATOR_SESSIONS_PER_MINUTE:-20}
      JAVA_OPTS: ${JAVA_OPTS:--Xms64m -Xmx320m -XX:+UseSerialGC}

  # ------------------------------------------------------------------ Giám sát (Prometheus + Grafana)
  # Prometheus chỉ mở trên localhost (không có xác thực); Grafana: http://localhost:3001 (admin / GRAFANA_PASSWORD)
  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - alertmanager

  # Gom nhóm / chống lặp cảnh báo của Prometheus rồi gửi webhook tới notification-service
  # (thông báo trong ứng dụng + Slack/Discord/Telegram/email). UI: http://localhost:9093 (chỉ localhost)
  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./infra/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager

  # Hộp thư SMTP giả lập: mọi email cảnh báo được giữ lại và xem tại http://localhost:8025 (không gửi ra Internet)
  mailpit:
    image: axllent/mailpit:v1.21.8
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"

  grafana:
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/shop-overview.json
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  # ------------------------------------------------------------------ Frontend (React build + Nginx, proxy /api → gateway)
  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api-gateway

  # ------------------------------------------------------------------ Kiểm thử tải (chỉ chạy khi gọi: docker compose --profile loadtest run k6 ...)
  k6:
    image: grafana/k6:0.54.0
    profiles: ["loadtest"]
    volumes:
      - ./scripts/k6:/scripts:ro
    environment:
      BASE_URL: http://api-gateway:8080
    entrypoint: ["k6"]
    command: ["run", "/scripts/simulate-traffic.js"]

volumes:
  postgres-data:
  kafka-data:
  streams-state:
  prometheus-data:
  grafana-data:
  alertmanager-data:
