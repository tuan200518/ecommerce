server:
  port: ${PORT:8082}

spring:
  application:
    name: user-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/user_db}
    username: ${DB_USER:shop}
    password: ${DB_PASSWORD:shop}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9094}
    consumer:
      group-id: user-service
      auto-offset-reset: earliest
    listener:
      concurrency: 3

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
