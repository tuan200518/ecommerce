server:
  port: ${PORT:8085}

spring:
  application:
    name: order-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/order_db}
    username: ${DB_USER:shop}
    password: ${DB_PASSWORD:shop}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate.default_batch_fetch_size: 50
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9094}
    consumer:
      group-id: order-service
      auto-offset-reset: earliest
    listener:
      concurrency: 3
    producer:
      acks: all

shop:
  order:
    # Quá thời gian này mà đơn chưa được giữ hàng + thanh toán → hủy (Saga timeout)
    processing-timeout: ${ORDER_TIMEOUT:PT2M}
    max-quantity-per-item: 20

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    com.shop: INFO
