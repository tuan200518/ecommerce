server:
  port: ${PORT:8091}

spring:
  application:
    name: simulator-service
  threads:
    virtual:
      enabled: true

shop:
  simulator:
    gateway-url: ${GATEWAY_URL:http://localhost:8080}
    # Tự chạy khi khởi động (docker compose bật sẵn để Dashboard luôn có dữ liệu)
    autostart: ${SIMULATOR_AUTOSTART:false}
    # Số phiên mua sắm bắt đầu mỗi phút (mỗi phiên = 1 khách vào web)
    sessions-per-minute: ${SIMULATOR_SESSIONS_PER_MINUTE:20}
    max-concurrent-sessions: 40
    # Tỷ lệ (0..1)
    browse-only-rate: 0.25        # chỉ xem rồi rời đi
    cart-abandon-rate: 0.2        # bỏ giỏ hàng
    payment-failure-rate: 0.05    # chọn MOCK_FAIL (thẻ bị từ chối)
    cancel-rate: 0.05             # đặt xong rồi hủy
    new-customer-rate: 0.03       # đăng ký tài khoản mới
    wave: true                    # lưu lượng dao động theo hình sin (giờ cao điểm / thấp điểm)
    auto-restock: true            # nhân viên kho ảo nhập hàng khi sắp hết
    auto-fulfill: true            # nhân viên kho/giao hàng ảo xử lý vận đơn: đóng gói → bàn giao → đang giao → đã giao
    suspicious-rate: 0.01         # "khách đáng ngờ": tài khoản mới đặt đơn rất lớn → Fraud Service gắn cờ
    review-rate: 0.15             # khách quay lại đánh giá / hỏi đáp sản phẩm đã nhận
    auto-risk-review: true        # nhân viên xác minh ảo xử lý đơn bị gắn cờ (≈45 giây)
    voucher-rate: 0.25            # khách nhập mã giảm giá công khai (chỉ khi báo giá cho thấy mã hợp lệ)
    flash-sale-rate: 0.3          # khách "săn" sản phẩm đang flash sale (nếu còn suất)
    support-rate: 0.03            # khách gửi yêu cầu hỗ trợ về một đơn đã đặt
    auto-support: true            # nhân viên CSKH ảo (support@shop.local) trả lời và giải quyết yêu cầu
    recommendation-rate: 0.35     # khách bấm vào sản phẩm được gợi ý ("Dành cho bạn", "Tương tự"...)
    customer-count: ${SEED_CUSTOMERS:50}
    customer-password: Customer@123
    staff-email: warehouse@shop.local
    staff-password: Manager@123
    analyst-email: analyst@shop.local
    analyst-password: Analyst@123
    support-email: support@shop.local
    support-password: Support@123

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
    # Simulator gọi API với URL chứa id → nhãn uri không giới hạn; metric phía client không cần cho giám sát
    enable:
      http.client.requests: false
