server:
  port: ${PORT:8086}

spring:
  application:
    name: inventory-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/inventory_db}
    username: ${DB_USER:shop}
    password: ${DB_PASSWORD:shop}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9094}
    consumer:
      group-id: inventory-service
      auto-offset-reset: earliest
    listener:
      concurrency: 3
    producer:
      acks: all

shop:
  inventory:
    default-initial-stock: 100
    default-low-stock-threshold: 10

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

logging:
  level:
    com.shop: INFO
