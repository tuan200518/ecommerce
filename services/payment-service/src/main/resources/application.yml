server:
  port: ${PORT:8087}

spring:
  application:
    name: payment-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payment_db}
    username: ${DB_USER:shop}
    password: ${DB_PASSWORD:shop}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9094}
    consumer:
      group-id: payment-service
      auto-offset-reset: earliest
    listener:
      concurrency: 3
    producer:
      acks: all

shop:
  payment:
    # Tỷ lệ giao dịch thẻ mô phỏng bị từ chối ngẫu nhiên (0.0 - 1.0)
    failure-rate: ${PAYMENT_FAILURE_RATE:0.1}
    # Độ trễ mô phỏng cổng thanh toán (ms)
    processing-delay-ms: ${PAYMENT_DELAY_MS:50}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
