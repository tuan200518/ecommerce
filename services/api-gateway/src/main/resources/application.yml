server:
  port: ${PORT:8080}

spring:
  application:
    name: api-gateway

shop:
  jwt:
    secret: ${JWT_SECRET:change-me-please-this-is-a-dev-only-secret-0123456789}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
  services:
    auth: ${AUTH_SERVICE_URL:http://localhost:8081}
    user: ${USER_SERVICE_URL:http://localhost:8082}
    product: ${PRODUCT_SERVICE_URL:http://localhost:8083}
    cart: ${CART_SERVICE_URL:http://localhost:8084}
    order: ${ORDER_SERVICE_URL:http://localhost:8085}
    inventory: ${INVENTORY_SERVICE_URL:http://localhost:8086}
    payment: ${PAYMENT_SERVICE_URL:http://localhost:8087}
    notification: ${NOTIFICATION_SERVICE_URL:http://localhost:8088}
    analytics: ${ANALYTICS_SERVICE_URL:http://localhost:8089}
    simulator: ${SIMULATOR_SERVICE_URL:http://localhost:8091}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway

logging:
  level:
    com.shop: INFO
